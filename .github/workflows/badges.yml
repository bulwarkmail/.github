name: Badges

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/badges.mjs]

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund opentype.js@1.3.4 @fontsource/hanken-grotesk @tabler/icons
      - run: node scripts/badges.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed badges
        run: |
          git add badges
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: update badges"
          git push
